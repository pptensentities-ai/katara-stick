<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>katarahousemain</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:-apple-system,sans-serif;overflow:hidden;touch-action:none}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:2;max-width:94vw}
button{color:#111;background:#ddd;border:0;padding:10px 12px;margin:4px 6px 0 0;border-radius:8px;font-size:16px}
button.on{background:#8fd18f}
#state{display:block;margin-top:10px;font-size:14px}
#c{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<div id="hud">
<div>katarahousemain</div>
<button type="button" id="b-stand" onclick="setIntent('stand')">stand</button>
<button type="button" id="b-sit_cross" onclick="setIntent('sit_cross')">sit</button>
<button type="button" id="b-wave" onclick="setIntent('wave')">wave</button>
<button type="button" id="b-wiggle_hips" onclick="setIntent('wiggle_hips')">wiggle</button>
<button type="button" id="b-walk" onclick="setIntent('walk')">walk</button>
<button type="button" onclick="startAct(60000)">act</button>
<span id="state">one tap walk · two fingers look</span>
</div>
<canvas id="c"></canvas>
<script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
<script>
const INTENT_URL='https://raw.githubusercontent.com/pptensentities-ai/katara-stick/main/intent.json';
const POSES=['stand','sit_cross','wave','wiggle_hips','walk'];
const WORLD=24,TILES=100;
const canvas=document.getElementById('c');
const scene=new THREE.Scene();
const daySky=new THREE.Color(0x87b6e0), nightSky=new THREE.Color(0x0b1020), skyNow=new THREE.Color();
scene.background=daySky.clone();
scene.fog=new THREE.Fog(0x87b6e0,20,48);
const camera=new THREE.PerspectiveCamera(55,1,0.1,80);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
function fit(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
fit();addEventListener('resize',fit);
const ambient=new THREE.AmbientLight(0xffe6c9,0.7);scene.add(ambient);
const moon=new THREE.DirectionalLight(0xc9d6ff,0.35);moon.position.set(-4,8,3);scene.add(moon);
const walkables=[];
function walkPlane(w,d,x,y,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({visible:false}));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);scene.add(m);walkables.push(m);return m;}
walkPlane(WORLD,WORLD,0,0.01,0);
const gc=document.createElement('canvas');gc.width=TILES;gc.height=TILES;const gg=gc.getContext('2d');
for(let z=0;z<TILES;z++)for(let x=0;x<TILES;x++){const n=Math.sin(x*12.9898+z*78.233)*43758.5453;const f=n-Math.floor(n);gg.fillStyle='rgb('+(58+f*40|0)+','+(118+f*50|0)+','+(40+f*22|0)+')';gg.fillRect(x,z,1,1);}
const grassTex=new THREE.CanvasTexture(gc);grassTex.magFilter=THREE.NearestFilter;grassTex.minFilter=THREE.NearestFilter;
const grassMat=new THREE.MeshStandardMaterial({map:grassTex,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(WORLD,WORLD),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-0.01;scene.add(ground);
const marker=new THREE.Mesh(new THREE.RingGeometry(0.12,0.18,18),new THREE.MeshBasicMaterial({color:0x88ffaa,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;marker.visible=false;scene.add(marker);
function box(w,h,d,mat,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);p.add(m);return m;}
const wood=new THREE.MeshStandardMaterial({color:0xc4a07a,roughness:0.8});
const woodDark=new THREE.MeshStandardMaterial({color:0x8a5a3a,roughness:0.75});
const cream=new THREE.MeshStandardMaterial({color:0xf3e4c8,roughness:0.85});
const glass=new THREE.MeshStandardMaterial({color:0x9ad7ff,transparent:true,opacity:0.35});
const W=3.6,D=3.4,H1=1.55,H2=1.5;
function cottage(ox,oz,roofCol,full){
  const house=new THREE.Group();house.position.set(ox,0,oz);scene.add(house);
  box(W+0.2,0.08,D+0.2,woodDark,0,0.04,0,house);
  box(W,H1+H2,0.08,cream,0,(H1+H2)/2,-D/2,house);
  box(W,H1+H2,0.08,cream,0,(H1+H2)/2,D/2,house);
  box(0.08,H1+H2,D,cream,-W/2,(H1+H2)/2,0,house);
  box(0.08,H1+H2,D,cream,W/2,(H1+H2)/2,0,house);
  box(0.7,1.15,0.12,woodDark,0.35,0.62,D/2+0.02,house);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(2.55,1.7,4),new THREE.MeshStandardMaterial({color:roofCol,roughness:0.55}));
  roof.position.set(0,H1+H2+0.75,0);roof.rotation.y=Math.PI/4;house.add(roof);
  walkPlane(W-0.2,D-0.2,ox,0.09,oz);
  if(full){
    box(W,0.06,D,wood,0,H1,0,house);
    walkPlane(W-0.2,D-0.2,ox,H1+0.04,oz);
    for(let i=0;i<8;i++){
      box(0.7,0.07,0.32,woodDark,W/2-0.55,0.12+i*0.19,0.55-i*0.12,house);
      walkPlane(0.7,0.34,ox+W/2-0.55,0.16+i*0.19,oz+0.55-i*0.12);
    }
  }
  return house;
}
const house=cottage(-1.2,-1.4,0xc45b6a,true);
cottage(7.2,-3.4,0x4a7c59,false);
cottage(-7.4,3.6,0x3d5a80,false);
const switchRoot=new THREE.Group();switchRoot.position.set(-0.55,0,D/2-0.45);house.add(switchRoot);
box(0.06,0.9,0.06,new THREE.MeshStandardMaterial({color:0x333333}),0,0.45,0,switchRoot);
const knobMat=new THREE.MeshStandardMaterial({color:0xff2a2a,emissive:0x661111});
const knob=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.06),knobMat);knob.position.set(0,1.05,0.08);switchRoot.add(knob);
const hitSwitch=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.3,0.4),new THREE.MeshBasicMaterial({visible:false}));hitSwitch.position.y=0.7;switchRoot.add(hitSwitch);
const light1=new THREE.PointLight(0xffd9a0,0.15,6);light1.position.set(0,H1-0.15,0.2);house.add(light1);
const bulb1=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,10),new THREE.MeshStandardMaterial({color:0xffcc88,emissive:0x331800}));bulb1.position.copy(light1.position);house.add(bulb1);
const light2=new THREE.PointLight(0xfff1c8,0.12,7);light2.position.set(0,H1+H2+0.15,0);house.add(light2);
let floor1On=false;
function setFloor1(on){floor1On=on;knobMat.color.set(on?0x3dff6a:0xff2a2a);knobMat.emissive.set(on?0x0d5a22:0x661111);light1.intensity=on?1.8:0.12;}
function setFloor2(on){light2.intensity=on?1.5:0.1;}
setFloor1(false);setFloor2(false);
const backWin=new THREE.Group();backWin.position.set(0.15,H1+0.78,-D/2-0.02);house.add(backWin);
box(0.7,0.58,0.06,wood,0,0,0,backWin);box(0.54,0.44,0.05,glass,0,0,-0.03,backWin);
const winHit=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.5),new THREE.MeshBasicMaterial({visible:false}));backWin.add(winHit);
const pie=new THREE.Group();pie.position.set(-1.2,0,-5.35);scene.add(pie);
const tin=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,0.18,24),new THREE.MeshStandardMaterial({color:0xb87333,metalness:0.4}));tin.position.y=0.12;pie.add(tin);
const filling=new THREE.Mesh(new THREE.SphereGeometry(0.82,18,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xc45a2a}));filling.position.y=0.18;pie.add(filling);
const fire=new THREE.Group();fire.visible=false;pie.add(fire);
const fireLight=new THREE.PointLight(0xff6622,0,5);fireLight.position.y=0.6;pie.add(fireLight);
for(let i=0;i<9;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.4,5),new THREE.MeshStandardMaterial({color:0xff6600,emissive:0xff3300}));f.position.set((Math.random()-0.5)*0.7,0.35,(Math.random()-0.5)*0.7);fire.add(f);}
let pieLit=false;
function lightPie(on){pieLit=on;fire.visible=on;fireLight.intensity=on?2.2:0;}
function pieScream(){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('ahhhh pie scream');u.pitch=1.55;speechSynthesis.speak(u);}catch(e){}}
let audioArmed=false;
function armAudio(){if(audioArmed)return;audioArmed=true;pieScream();const loop=()=>{pieScream();setTimeout(loop,7000+Math.random()*11000);};setTimeout(loop,8000);}
const skin=new THREE.MeshStandardMaterial({color:0xf0c3ae});
const shirt=new THREE.MeshStandardMaterial({color:0xd48bb3});
const pants=new THREE.MeshStandardMaterial({color:0x3a3a52});
const hairM=new THREE.MeshStandardMaterial({color:0x2b1a14});
const hide=new THREE.MeshBasicMaterial({visible:false});
function bone(len){return new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,len,6),hide);}
function joint(){return new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),hide);}
function cap(mat,r,h){return new THREE.Mesh(new THREE.CapsuleGeometry(r,h,4,8),mat);}
const body=new THREE.Group();body.position.set(1.6,0,2.2);scene.add(body);
const hips=joint();body.add(hips);
const torso=bone(0.45);hips.add(torso);torso.position.y=0.28;
const head=joint();torso.add(head);head.position.y=0.32;
const lArm=bone(0.32),rArm=bone(0.32);torso.add(lArm);torso.add(rArm);lArm.position.set(-0.18,0.12,0);rArm.position.set(0.18,0.12,0);
const lThigh=bone(0.4),rThigh=bone(0.4),lShin=bone(0.38),rShin=bone(0.38);
hips.add(lThigh);hips.add(rThigh);lThigh.add(lShin);rThigh.add(rShin);
lThigh.position.set(-0.12,-0.05,0);rThigh.position.set(0.12,-0.05,0);lShin.position.y=-0.38;rShin.position.y=-0.38;
const pelvis=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,10),pants);pelvis.scale.set(1.15,0.7,0.85);hips.add(pelvis);
torso.add(Object.assign(cap(shirt,0.13,0.28),{position:new THREE.Vector3(0,0.02,0)}));
head.add(new THREE.Mesh(new THREE.SphereGeometry(0.16,16,14),skin));
const hair=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),hairM);hair.scale.set(1.05,0.72,1.05);hair.position.set(0,0.07,-0.01);head.add(hair);
lArm.add(cap(shirt,0.05,0.22));rArm.add(cap(shirt,0.05,0.22));
lThigh.add(cap(pants,0.065,0.26));rThigh.add(cap(pants,0.065,0.26));
lShin.add(cap(pants,0.05,0.24));rShin.add(cap(pants,0.05,0.24));
const parts={hips,lArm,rArm,lThigh,rThigh,lShin,rShin};
function P(x,y,z,rx,ry,rz){return{pos:new THREE.Vector3(x,y,z),rot:new THREE.Euler(rx,ry,rz)};}
const catalog={
stand:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.4),rArm:P(0.18,0.12,0,0,0,-0.4),lThigh:P(-0.12,-0.05,0,0,0,0.05),rThigh:P(0.12,-0.05,0,0,0,-0.05),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)},
sit_cross:{hips:P(0,0.28,0,0.15,0,0),lArm:P(-0.18,0.12,0,0.2,0,0.5),rArm:P(0.18,0.12,0,0.2,0,-0.5),lThigh:P(-0.12,-0.05,0,1.1,0.6,0.7),rThigh:P(0.12,-0.05,0,1.1,-0.6,-0.7),lShin:P(0,-0.38,0,1.3,0.2,0),rShin:P(0,-0.38,0,1.3,-0.2,0)},
wave:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.4),rArm:P(0.18,0.12,0,0,0,-2.2),lThigh:P(-0.12,-0.05,0,0,0,0.05),rThigh:P(0.12,-0.05,0,0,0,-0.05),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)},
wiggle_hips:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.55),rArm:P(0.18,0.12,0,0,0,-0.55),lThigh:P(-0.12,-0.05,0,0,0,0.08),rThigh:P(0.12,-0.05,0,0,0,-0.08),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)},
walk:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.35),rArm:P(0.18,0.12,0,0,0,-0.35),lThigh:P(-0.12,-0.05,0,0,0,0.05),rThigh:P(0.12,-0.05,0,0,0,-0.05),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)}
};
function snapPose(name){const pose=catalog[name]||catalog.stand;for(const k in parts){parts[k].position.copy(pose[k].pos);parts[k].rotation.copy(pose[k].rot);}}
let intent='walk',target=catalog.walk,lastT=-1,actTimer=0;
let walkTarget=body.position.clone();
const qT=new THREE.Quaternion(),qC=new THREE.Quaternion();
const cam={theta:0.95,phi:0.42,dist:7.2,lookY:1.3};
function placeCam(){
  camera.position.set(body.position.x+Math.sin(cam.theta)*Math.cos(cam.phi)*cam.dist,body.position.y+cam.lookY+Math.sin(cam.phi)*cam.dist,body.position.z+Math.cos(cam.theta)*Math.cos(cam.phi)*cam.dist);
  camera.lookAt(body.position.x,body.position.y+0.9,body.position.z);
}
placeCam();
function worldSwitch(){return switchRoot.getWorldPosition(new THREE.Vector3());}
function worldWindow(){return backWin.getWorldPosition(new THREE.Vector3());}
function nearSwitch(){return body.position.distanceTo(worldSwitch())<1.2;}
function onSecond(){return body.position.y>1.2;}
function nearWindow(){return onSecond()&&body.position.distanceTo(worldWindow())<1.35;}
function poseOnly(name,source){if(!catalog[name])name='stand';if(name==='walk')snapPose('walk');intent=name;target=catalog[intent];if(name!=='walk')marker.visible=false;document.getElementById('state').textContent=intent+(source?' \u00b7 '+source:'');
['stand','sit_cross','wave','wiggle_hips','walk'].forEach(id=>{const el=document.getElementById('b-'+id);if(el)el.classList.toggle('on',intent===id);});}
window.startAct=function(ms){clearInterval(actTimer);const until=Date.now()+(ms||60000);const tick=()=>{if(Date.now()>until){clearInterval(actTimer);poseOnly('wave','act-done');return;}poseOnly(POSES[Math.floor(Math.random()*POSES.length)],'act');};tick();actTimer=setInterval(tick,2200);};
window.setIntent=function(name,source){if(name==='act_random'||name==='random'||name==='act'){startAct(60000);return;}clearInterval(actTimer);poseOnly(name,source);};
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(cx,cy){ndc.set((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
if(ray.intersectObject(hitSwitch,true).length)return{kind:'switch'};
if(ray.intersectObject(winHit,true).length)return{kind:'pieWindow'};
const g=ray.intersectObjects(walkables,false);if(g.length)return{kind:'ground',pt:g[0].point};return null;}
function goTo(pt){if(!pt)return;walkTarget.copy(pt);marker.position.set(pt.x,pt.y+0.02,pt.z);marker.visible=true;if(intent!=='walk')poseOnly('walk','tap');}
function tapAt(cx,cy){armAudio();const hit=pick(cx,cy);if(!hit)return;
if(hit.kind==='switch'){if(nearSwitch()){setFloor1(!floor1On);document.getElementById('state').textContent='light '+(floor1On?'ON':'OFF');}else goTo(worldSwitch());return;}
if(hit.kind==='pieWindow'){if(nearWindow()){lightPie(!pieLit);pieScream();document.getElementById('state').textContent=pieLit?'PIE FIRE':'pie out';}else goTo(worldWindow());return;}
if(intent==='walk')goTo(hit.pt);}
const pointers=new Map();
let pinch0=0,dist0=7.2,theta0=0.95,phi0=0.42,mid0x=0,mid0y=0,two=false;
function pts(){return Array.from(pointers.values());}
function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=pts();if(p.length===2){two=true;pinch0=dist2(p[0],p[1]);dist0=cam.dist;theta0=cam.theta;phi0=cam.phi;mid0x=(p[0].x+p[1].x)/2;mid0y=(p[0].y+p[1].y)/2;}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=pts();if(p.length>=2){two=true;const pin=dist2(p[0],p[1]);if(pinch0>8)cam.dist=Math.min(16,Math.max(2,dist0*(pinch0/pin)));const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;cam.theta=theta0-(mx-mid0x)*0.008;cam.phi=Math.min(1.2,Math.max(0.08,phi0+(my-mid0y)*0.006));placeCam();}});
function endPtr(e){const wasTwo=two,n=pointers.size,last=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2){if(!wasTwo&&n===1&&last)tapAt(last.x,last.y);two=false;}}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
setIntent(new URLSearchParams(location.search).get('intent')||'walk','boot');
async function poll(){try{const res=await fetch(INTENT_URL+'?cache='+Date.now());if(!res.ok)return;const data=await res.json();if(data.t!==lastT&&data.intent){lastT=data.t;setIntent(data.intent,data.source||'chat');}}catch(e){}}
setInterval(poll,1200);poll();
const blend=0.14,walkSpeed=1.65;
(function loop(now){
  requestAnimationFrame(loop);
  const dt=0.016;
  const cycle=(now/1000%30)/30;
  const night=0.5-0.5*Math.cos(cycle*Math.PI*2);
  skyNow.copy(daySky).lerp(nightSky,night);
  scene.background.copy(skyNow);scene.fog.color.copy(skyNow);
  ambient.intensity=0.35+(1-night)*0.4;
  moon.intensity=0.12+(1-night)*0.28;
  grassMat.color.setRGB(1-night*0.5,1-night*0.4,1-night*0.2);
  setFloor2(onSecond());
  if(pieLit){fire.children.forEach((f,i)=>{f.scale.y=0.8+Math.sin(now/90+i)*0.35;});fireLight.intensity=1.6+Math.sin(now/80)*0.7;}
  if(intent==='walk'){
    const dx=walkTarget.x-body.position.x,dy=walkTarget.y-body.position.y,dz=walkTarget.z-body.position.z,dist=Math.hypot(dx,dy,dz);
    if(dist>0.07){
      const step=Math.min(dist,walkSpeed*dt);
      body.position.x+=(dx/dist)*step;body.position.y+=(dy/dist)*step;body.position.z+=(dz/dist)*step;
      if(Math.hypot(dx,dz)>0.02)body.rotation.y=Math.atan2(dx,dz);
      const g=now/140;
      lThigh.rotation.set(Math.sin(g)*0.55,0,0.05);rThigh.rotation.set(Math.sin(g+Math.PI)*0.55,0,-0.05);
      lShin.rotation.set(Math.max(0,-Math.sin(g)*0.35),0,0);rShin.rotation.set(Math.max(0,-Math.sin(g+Math.PI)*0.35),0,0);
      lArm.rotation.set(Math.sin(g+Math.PI)*0.4,0,0.35);rArm.rotation.set(Math.sin(g)*0.4,0,-0.35);
      hips.position.y=0.95+Math.abs(Math.sin(g))*0.03;
    }else marker.visible=false;
    placeCam();
  }else{
    for(const k in parts){const obj=parts[k],tg=target[k];obj.position.lerp(tg.pos,blend);qT.setFromEuler(tg.rot);qC.setFromEuler(obj.rotation);qC.slerp(qT,blend);obj.rotation.setFromQuaternion(qC);}
    if(intent==='wave')rArm.rotation.z+=Math.sin(now/180)*0.04;
    if(intent==='wiggle_hips')hips.rotation.z+=Math.sin(now/140)*0.04;
    placeCam();
  }
  renderer.render(scene,camera);
})(0);
</script>
</body>
</html>
