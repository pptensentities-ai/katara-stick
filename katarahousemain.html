function blocked(x,z,y){for(let i=0;i<walls.length;i++)if(hitsBox(x,z,y,walls[i]))return true;for(let i=0;i<houses.length;i++)if(!houses[i].doorOpen&&hitsBox(x,z,y,houses[i].doorGap))return true;return false;}

for(let i=0;i<7;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.4,5),new THREE.MeshStandardMaterial({color:0xff6600,emissive:0xff3300}));f.position.set((Math.random()-0.5)*0.7,0.35,(Math.random()-0.5)*0.7);fire.add(f);}

const skin=new THREE.MeshStandardMaterial({color:0xf0c3ae});

const body=new THREE.Group();body.position.set(1.6,0.12,2.2);scene.add(body);

const parts={hips,lArm,rArm,lThigh,rThigh,lShin,rShin};
function P(x,y,z,rx,ry,rz){return{pos:new THREE.Vector3(x,y,z),rot:new THREE.Euler(rx,ry,rz)};}
const catalog={
stand:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.4),rArm:P(0.18,0.12,0,0,0,-0.4),lThigh:P(-0.12,-0.05,0,0,0,0.05),rThigh:P(0.12,-0.05,0,0,0,-0.05),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)},
sit_cross:{hips:P(0,0.28,0,0.15,0,0),lArm:P(-0.18,0.12,0,0.2,0,0.5),rArm:P(0.18,0.12,0,0.2,0,-0.5),lThigh:P(-0.12,-0.05,0,1.1,0.6,0.7),rThigh:P(0.12,-0.05,0,1.1,-0.6,-0.7),lShin:P(0,-0.38,0,1.3,0.2,0),rShin:P(0,-0.38,0,1.3,-0.2,0)},
wave:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.4),rArm:P(0.18,0.12,0,0,0,-2.2),lThigh:P(-0.12,-0.05,0,0,0,0.05),rThigh:P(0.12,-0.05,0,0,0,-0.05),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)},
wiggle_hips:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.55),rArm:P(0.18,0.12,0,0,0,-0.55),lThigh:P(-0.12,-0.05,0,0,0,0.08),rThigh:P(0.12,-0.05,0,0,0,-0.08),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)},
walk:{hips:P(0,0.95,0,0,0,0),lArm:P(-0.18,0.12,0,0,0,0.35),rArm:P(0.18,0.12,0,0,0,-0.35),lThigh:P(-0.12,-0.05,0,0,0,0.05),rThigh:P(0.12,-0.05,0,0,0,-0.05),lShin:P(0,-0.38,0,0,0,0),rShin:P(0,-0.38,0,0,0,0)}

function snapPose(name){const pose=catalog[name]||catalog.stand;for(const k in parts){parts[k].position.copy(pose[k].pos);parts[k].rotation.copy(pose[k].rot);}}

let walkTarget=body.position.clone();
const qT=new THREE.Quaternion(),qC=new THREE.Quaternion();
let firstPerson=false;
const cam={theta:0.95,phi:0.42,dist:7.2,lookY:1.3};

function placeCam(){
  if(firstPerson){
    const hx=body.position.x,hy=body.position.y+1.52,hz=body.position.z;
    camera.position.set(hx,hy,hz);
    camera.lookAt(hx+Math.sin(cam.theta)*Math.cos(cam.phi),hy+Math.sin(cam.phi)*0.35,hz+Math.cos(cam.theta)*Math.cos(cam.phi));

    camera.lookAt(body.position.x,body.position.y+0.9,body.position.z);

placeCam();
const _tmp=new THREE.Vector3();
function worldOf(obj){return obj.getWorldPosition(_tmp.clone());}
function nearOf(h,obj,r){return body.position.distanceTo(worldOf(obj))<r;}
function onSecond(){return body.position.y>1.6;}

if(intent==='walk')goTo(hit.pt);}
const pointers=new Map();let pinch0=0,dist0=7.2,theta0=0.95,phi0=0.42,mid0x=0,mid0y=0,two=false,twoStart=0,twoMoved=0;

function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=pts();if(p.length===2){two=true;twoStart=performance.now();twoMoved=0;pinch0=dist2(p[0],p[1]);dist0=cam.dist;theta0=cam.theta;phi0=cam.phi;mid0x=(p[0].x+p[1].x)/2;mid0y=(p[0].y+p[1].y)/2;}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=pts();if(p.length>=2){two=true;const pin=dist2(p[0],p[1]);const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;twoMoved=Math.max(twoMoved,Math.hypot(mx-mid0x,my-mid0y)+Math.abs(pin-pinch0));if(pinch0>8&&!firstPerson)cam.dist=Math.min(18,Math.max(2.2,dist0*(pinch0/pin)));cam.theta=theta0-(mx-mid0x)*0.008;cam.phi=Math.min(1.15,Math.max(-0.4,phi0+(my-mid0y)*0.006));placeCam();}});
function endPtr(e){const wasTwo=two,n=pointers.size,last=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2){if(wasTwo&&n>=2&&twoMoved<22&&(performance.now()-twoStart)<320)toggleFP();else if(!wasTwo&&n===1&&last)tapAt(last.x,last.y);two=false;}}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);canvas.addEventListener('contextmenu',e=>e.preventDefault());
setIntent(new URLSearchParams(location.search).get('intent')||'walk','boot');
async function poll(){try{const res=await fetch(INTENT_URL+'?cache='+Date.now());if(!res.ok)return;const data=await res.json();if(data.t!==lastT&&data.intent){lastT=data.t;setIntent(data.intent,data.source||'chat');}}catch(e){}}
setInterval(poll,1200);poll();
const blend=0.14,walkSpeed=2.2;
(function loop(now){
  requestAnimationFrame(loop);
  const dt=0.016,cycle=(now/1000%30)/30,night=0.5-0.5*Math.cos(cycle*Math.PI*2);
  grassMat.color.setRGB(1-night*0.55,1-night*0.45,1-night*0.25);
  skyNow.copy(daySky).lerp(nightSky,night);scene.background.copy(skyNow);scene.fog.color.copy(skyNow);
  ambient.intensity=0.28+(1-night)*0.55;sun.intensity=0.08+(1-night)*0.85;
  sun.position.set(Math.cos(cycle*Math.PI*2)*20,8+Math.sin(cycle*Math.PI*2)*22,12);
  houses.forEach(h=>{const on2=body.position.distanceTo(h.house.position)<6&&onSecond();h.light2.intensity=on2?1.5:0.08;});
  if(pieLit){fire.children.forEach((f,i)=>{f.scale.y=0.8+Math.sin(now/90+i)*0.35;});fireLight.intensity=1.6+Math.sin(now/80)*0.7;}
  if(intent==='walk'){
    const dx=walkTarget.x-body.position.x,dy=walkTarget.y-body.position.y,dz=walkTarget.z-body.position.z,dist=Math.hypot(dx,dy,dz);
    if(dist>0.07){
      const step=Math.min(dist,walkSpeed*dt);const nx=body.position.x+(dx/dist)*step,ny=body.position.y+(dy/dist)*step,nz=body.position.z+(dz/dist)*step;
      if(!blocked(nx,nz,ny))body.position.set(nx,ny,nz);
      else if(!blocked(nx,body.position.z,ny)){body.position.x=nx;body.position.y=ny;}
      else if(!blocked(body.position.x,nz,ny)){body.position.z=nz;body.position.y=ny;}
      if(Math.hypot(dx,dz)>0.02)body.rotation.y=Math.atan2(dx,dz);
      const g=now/140;
      lThigh.rotation.set(Math.sin(g)*0.55,0,0.05);rThigh.rotation.set(Math.sin(g+Math.PI)*0.55,0,-0.05);
      lShin.rotation.set(Math.max(0,-Math.sin(g)*0.35),0,0);rShin.rotation.set(Math.max(0,-Math.sin(g+Math.PI)*0.35),0,0);
      lArm.rotation.set(Math.sin(g+Math.PI)*0.4,0,0.35);rArm.rotation.set(Math.sin(g)*0.4,0,-0.35);
      hips.position.y=0.95+Math.abs(Math.sin(g))*0.03;
    }else{marker.visible=false;}
    placeCam();
  }else{
    for(const k in parts){const obj=parts[k],tg=target[k];obj.position.lerp(tg.pos,blend);qT.setFromEuler(tg.rot);qC.setFromEuler(obj.rotation);qC.slerp(qT,blend);obj.rotation.setFromQuaternion(qC);}
    if(intent==='wave')rArm.rotation.z+=Math.sin(now/180)*0.04;
    if(intent==='wiggle_hips')hips.rotation.z+=Math.sin(now/140)*0.04;
    placeCam();
  }
  renderer.render(scene,camera);
})(0);
</script>
